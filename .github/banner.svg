<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="agent-skills: rules, skills and roles for AI coding agents">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07021a"/>
      <stop offset="0.55" stop-color="#1d0a3f"/>
      <stop offset="0.78" stop-color="#5a0f63"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe36e"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cf2ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14002b"/>
      <stop offset="1" stop-color="#05000f"/>
    </linearGradient>
    <mask id="sunstripes">
      <rect x="0" y="0" width="1280" height="400" fill="#fff"/>
      <rect x="0" y="214" width="1280" height="3" fill="#000"/>
      <rect x="0" y="226" width="1280" height="5" fill="#000"/>
      <rect x="0" y="239" width="1280" height="7" fill="#000"/>
      <rect x="0" y="252" width="1280" height="9" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorclip"><rect x="0" y="262" width="1280" height="138"/></clipPath>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.8">
    <circle cx="90" cy="40" r="1.4"/><circle cx="210" cy="92" r="1"/><circle cx="330" cy="28" r="1.6"/>
    <circle cx="470" cy="70" r="1"/><circle cx="820" cy="36" r="1.3"/><circle cx="930" cy="84" r="1"/>
    <circle cx="1050" cy="30" r="1.6"/><circle cx="1180" cy="66" r="1.1"/><circle cx="1240" cy="120" r="0.9"/>
    <circle cx="40" cy="130" r="0.9"/><circle cx="700" cy="22" r="1"/><circle cx="380" cy="140" r="0.8"/>
  </g>

  <circle cx="640" cy="252" r="96" fill="url(#sun)" mask="url(#sunstripes)" filter="url(#softglow)"/>

  <polyline points="0,262 120,214 210,246 330,190 450,250 520,232 560,262" fill="#0d0221" stroke="#ff4fd8" stroke-width="2" filter="url(#softglow)"/>
  <polyline points="720,262 790,226 880,248 990,186 1100,240 1190,208 1280,262" fill="#0d0221" stroke="#ff4fd8" stroke-width="2" filter="url(#softglow)"/>

  <rect x="0" y="262" width="1280" height="138" fill="url(#floor)"/>
  <g clip-path="url(#floorclip)" stroke="#3cf2ff" stroke-width="1.6" opacity="0.85" filter="url(#softglow)">
    <line x1="0" y1="264" x2="1280" y2="264"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="0" y1="279" x2="1280" y2="279"/>
    <line x1="0" y1="292" x2="1280" y2="292"/>
    <line x1="0" y1="310" x2="1280" y2="310"/>
    <line x1="0" y1="334" x2="1280" y2="334"/>
    <line x1="0" y1="366" x2="1280" y2="366"/>
    <line x1="640" y1="262" x2="640" y2="400"/>
    <line x1="640" y1="262" x2="520" y2="400"/><line x1="640" y1="262" x2="760" y2="400"/>
    <line x1="640" y1="262" x2="390" y2="400"/><line x1="640" y1="262" x2="890" y2="400"/>
    <line x1="640" y1="262" x2="250" y2="400"/><line x1="640" y1="262" x2="1030" y2="400"/>
    <line x1="640" y1="262" x2="90" y2="400"/><line x1="640" y1="262" x2="1190" y2="400"/>
    <line x1="640" y1="262" x2="-90" y2="400"/><line x1="640" y1="262" x2="1370" y2="400"/>
    <line x1="640" y1="262" x2="-300" y2="400"/><line x1="640" y1="262" x2="1580" y2="400"/>
  </g>

  <text x="640" y="112" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="92" font-weight="700" letter-spacing="10" fill="url(#title)" filter="url(#glow)">AGENT//SKILLS</text>
  <text x="640" y="150" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="22" letter-spacing="6" fill="#ffe36e" filter="url(#softglow)">RULES · SKILLS · ROLES  FOR AI CODING AGENTS</text>
</svg>
